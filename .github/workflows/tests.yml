name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[langchain]"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run named pilot
        run: context-auditor run --config configs/experiments/pilot_custom_react_v1.json
