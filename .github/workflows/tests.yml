name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[langchain,dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Validate versioned datasets
        run: |
          context-auditor validate-dataset --dataset-name context_bloat_benchmark --dataset-version v1
          context-auditor validate-dataset --dataset-name external_validation --dataset-version v1
      - name: Run named pilot
        run: context-auditor run --config configs/experiments/pilot_custom_react_v1.json
