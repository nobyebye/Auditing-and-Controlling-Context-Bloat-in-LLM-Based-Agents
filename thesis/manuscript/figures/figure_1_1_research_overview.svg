<text x="660" y="591.5" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212B">Duplicate</text>
<text x="660" y="617.5" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212B">Irrelevant or stale</text>
<text x="660" y="643.5" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212B">Verbose</text>
<text x="660" y="669.5" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212B">Cross-source accumulation</text>
