<text x="1170" y="230.0" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#FFFFFF">Runtime auditing</text>
<text x="1170" y="413.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B">1 Capture before each LLM call</text>
<text x="1170" y="441.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B"></text>
<text x="1170" y="469.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B">2 Attribute source provenance</text>
<text x="1170" y="497.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B"></text>
<text x="1170" y="525.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B">3 Detect and localize bloat</text>
<text x="1170" y="553.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B"></text>
<text x="1170" y="581.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B">4 Measure tokens, ratios, and</text>
<text x="1170" y="609.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="400" fill="#17212B">growth</text>
<polyline points="1360,365 1475,365" fill="none" stroke="#425466" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/>
