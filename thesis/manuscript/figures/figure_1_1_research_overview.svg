<text x="1667" y="228.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF">Source-aware control</text>
<text x="1667" y="356.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="400" fill="#17212B">Remove exact duplicates</text>
<text x="1667" y="383.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="400" fill="#17212B">Filter stale or irrelevant context</text>
<text x="1667" y="410.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="400" fill="#17212B">Compress verbose tool output</text>
<polyline points="1667,505 1667,585" fill="none" stroke="#425466" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1490" y="600" width="355" height="200" rx="10" fill="#F4ECD4" stroke="#8D6B18" stroke-width="3"/>
<rect x="1490" y="600" width="355" height="52" rx="8" fill="#8D6B18" stroke="#8D6B18" stroke-width="0"/>
<text x="1667" y="638.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF">Joint evaluation</text>
<text x="1667" y="709.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="400" fill="#17212B">Efficiency: tokens, cost, latency</text>
<text x="1667" y="736.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="400" fill="#17212B">Utility: task success and</text>
<text x="1667" y="763.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="400" fill="#17212B">non-inferiority</text>
