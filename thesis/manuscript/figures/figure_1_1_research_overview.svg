<text x="950" y="72.0" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#17212B">Research overview: auditing and controlling context bloat in LLM-based agents</text>
<text x="950" y="116.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="400" fill="#53616F">Automatically constructed context is the research object; avoidable bloat is the central problem.</text>
