<text x="660" y="351.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#17212B">System + user + framework</text>
<text x="660" y="381.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#17212B">+ retrieval + memory</text>
<text x="660" y="411.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#17212B">+ tools + generated traces</text>
